<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061126">
<title>课堂抢答 · 大屏演示</title>
<style>
:root{color-scheme:dark;--bg:#061126;--cyan:#73d8ff;--blue:#328dff;--white:#edf6ff;--muted:#89a2c4;--gold:#ffd68a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--white)}
.scene{position:relative;width:100vw;height:100dvh;min-height:540px;overflow:hidden;background:radial-gradient(ellipse 55% 44% at 50% 43%,#102d58 0%,#0a1d3c 40%,#07142c 74%,#050d1d 100%)}
.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,10,24,.18),transparent 30%,transparent 75%,rgba(2,8,19,.36));pointer-events:none}
#stars{position:absolute;inset:0;width:100%;height:100%;opacity:.78}.haze{position:absolute;width:52vw;height:52vw;max-width:850px;max-height:850px;border-radius:50%;left:50%;top:47%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(33,117,218,.16),rgba(20,79,159,.06) 42%,transparent 69%);filter:blur(14px);pointer-events:none}
header{display:none}
main{position:absolute;inset:0;display:grid;place-items:center;z-index:1}.center{position:relative;text-align:center;width:min(90vw,900px);margin-top:-1vh}.eyebrow{font-size:clamp(11px,.9vw,14px);color:#9db7d8;letter-spacing:.36em;font-weight:450;margin-bottom:30px;transition:all .5s}.dial{position:relative;width:min(34vw,410px);min-width:250px;aspect-ratio:1;margin:auto;display:grid;place-items:center;filter:drop-shadow(0 0 42px rgba(39,142,255,.1));transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s}.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}.track{fill:none;stroke:rgba(131,174,228,.12);stroke-width:1.2}.progress{fill:none;stroke:url(#ring);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:314.16;stroke-dashoffset:0;filter:drop-shadow(0 0 6px rgba(99,203,255,.9));transition:stroke-dashoffset 1s linear}.orbit{position:absolute;inset:8%;border:1px solid rgba(102,164,237,.09);border-radius:50%;box-shadow:inset 0 0 40px rgba(61,145,234,.025)}.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;width:4px;height:4px;background:#a3e8ff;box-shadow:0 0 10px 2px #65caff;left:50%;top:-2px}.orbit:after{width:3px;height:3px;top:auto;left:11%;bottom:20%;opacity:.55}.number{position:relative;font-size:clamp(112px,15vw,198px);line-height:.9;font-weight:250;letter-spacing:-.08em;font-variant-numeric:tabular-nums;color:#f2f8ff;text-shadow:0 0 34px rgba(101,182,255,.2);transition:transform .25s,color .25s}.unit{font-size:14px;letter-spacing:.32em;color:#9ab5d8;margin-top:20px;margin-left:.32em}.sub{margin-top:32px;color:#a0b9d8;font-size:clamp(13px,1.05vw,16px);letter-spacing:.16em;transition:opacity .3s}.hint{position:absolute;bottom:5%;left:0;right:0;text-align:center;color:rgba(124,154,193,.52);font-size:11px;letter-spacing:.12em;z-index:2}.results{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .7s,transform .7s,visibility .7s}.result-wrap{width:min(73vw,1000px);text-align:center}.result-title{font-size:13px;color:#9bb4d4;letter-spacing:.42em;margin-bottom:56px}.podium{display:grid;grid-template-columns:1fr 1.14fr 1fr;align-items:end;gap:clamp(15px,4vw,56px)}.person{position:relative;padding:0 10px 22px;opacity:0;transform:translateY(18px);transition:opacity .55s,transform .6s}.person.show{opacity:1;transform:translateY(0)}.person.first{padding-bottom:44px}.rank{font-size:12px;letter-spacing:.22em;color:#8aa4c8;margin-bottom:22px}.first .rank{color:var(--gold)}.medal{width:clamp(76px,8vw,110px);height:clamp(76px,8vw,110px);margin:0 auto 21px;border:1px solid rgba(161,202,255,.56);border-radius:50%;display:block;overflow:hidden;background:#122b4e;box-shadow:0 0 30px rgba(48,139,231,.2),inset 0 0 20px rgba(101,181,255,.07)}.medal img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 35%}.first .medal{width:clamp(96px,10vw,138px);height:clamp(96px,10vw,138px);border:1px solid rgba(255,215,151,.82);box-shadow:0 0 50px rgba(255,190,93,.27),0 0 0 6px rgba(255,214,138,.06)}.name{font-size:clamp(17px,2vw,27px);font-weight:450;letter-spacing:.08em;color:#eaf3ff}.first .name{font-size:clamp(21px,2.5vw,34px);color:#fff}.seat{margin-top:10px;font-size:12px;color:#829cbd;letter-spacing:.14em}.base{height:1px;margin:24px auto 0;width:70%;background:linear-gradient(90deg,transparent,rgba(93,151,226,.36),transparent)}.first .base{height:2px;background:linear-gradient(90deg,transparent,rgba(255,209,133,.78),transparent);box-shadow:0 0 14px rgba(255,196,105,.26)}.again{margin-top:54px;border:1px solid rgba(134,183,239,.3);border-radius:999px;background:rgba(8,25,51,.38);color:#adc7e8;padding:11px 24px;font:inherit;font-size:12px;letter-spacing:.14em;cursor:pointer;transition:.25s}.again:hover{border-color:#7fd9ff;color:white;box-shadow:0 0 24px rgba(73,167,255,.16)}
.scene.done .dial,.scene.done .sub{opacity:0;transform:scale(.94);pointer-events:none}.scene.done .eyebrow{opacity:0;transform:translateY(-8px)}.scene.done .results{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.scene.running .number.pulse{transform:scale(1.06);color:#fff}.scene.running .dial{animation:breathe 2.8s ease-in-out infinite}@keyframes breathe{0%,100%{filter:drop-shadow(0 0 28px rgba(39,142,255,.1))}50%{filter:drop-shadow(0 0 48px rgba(39,142,255,.22))}}
@media(max-width:700px){header{top:24px;left:24px;right:24px}.dial{width:66vw;min-width:0}.result-wrap{width:90vw}.result-title{margin-bottom:44px}.podium{gap:8px}.person{padding-left:2px;padding-right:2px}.person.first{padding-bottom:28px}.hint{bottom:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><div class="scene" id="scene"><canvas id="stars"></canvas><div class="haze"></div><header><div class="brand">课堂抢答</div><div class="state"><i></i><span id="stateText">等待教师开启</span></div></header><main><section class="center"><div class="eyebrow" id="eyebrow">READY WHEN YOU ARE</div><div class="dial"><div class="orbit"></div><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="ring"><stop stop-color="#59baff"/><stop offset=".55" stop-color="#8ceaff"/><stop offset="1" stop-color="#438eff"/></linearGradient></defs><circle class="track" cx="60" cy="60" r="50"/><circle class="progress" id="progress" cx="60" cy="60" r="50"/></svg><div><div class="number" id="number">05</div><div class="unit">秒</div></div></div><div class="sub" id="sub">准备抢答</div></section><section class="results" id="results"><div class="result-wrap"><div class="result-title">本轮抢答结果</div><div class="podium"><article class="person" id="p2"><div class="rank">SECOND</div><div class="medal"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=256&h=256&q=85" alt="陈一鸣头像"></div><div class="name">陈一鸣</div><div class="seat">08 号</div><div class="base"></div></article><article class="person first" id="p1"><div class="rank">FIRST · 优先作答</div><div class="medal"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=320&h=320&q=85" alt="林知夏头像"></div><div class="name">林知夏</div><div class="seat">16 号</div><div class="base"></div></article><article class="person" id="p3"><div class="rank">THIRD</div><div class="medal"><img src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=256&h=256&q=85" alt="周可欣头像"></div><div class="name">周可欣</div><div class="seat">23 号</div><div class="base"></div></article></div><button class="again" id="again">再演示一次</button></div></section></main><div class="hint">课堂大屏演示 · 点击任意位置重新开始</div></div>
<script>
const scene=document.querySelector('#scene'),number=document.querySelector('#number'),progress=document.querySelector('#progress'),stateText=document.querySelector('#stateText'),eyebrow=document.querySelector('#eyebrow'),sub=document.querySelector('#sub');let timer=null,started=false;const circumference=2*Math.PI*50;progress.style.strokeDasharray=circumference;
function start(){clearInterval(timer);started=true;scene.classList.remove('done','running');document.querySelectorAll('.person').forEach(p=>p.classList.remove('show'));number.textContent='05';number.classList.remove('pulse');progress.style.strokeDashoffset='0';stateText.textContent='抢答进行中';eyebrow.textContent='BUZZER OPEN';sub.textContent='请在 5 秒内完成抢答';void scene.offsetWidth;scene.classList.add('running');let n=5;timer=setInterval(()=>{n--;number.textContent=String(Math.max(n,0)).padStart(2,'0');number.classList.remove('pulse');void number.offsetWidth;number.classList.add('pulse');progress.style.strokeDashoffset=String(circumference*(1-Math.max(n,0)/5));if(n<=0){clearInterval(timer);setTimeout(showResults,450)}},1000)}
function showResults(){scene.classList.remove('running');scene.classList.add('done');stateText.textContent='抢答结束';setTimeout(()=>document.querySelector('#p1').classList.add('show'),180);setTimeout(()=>document.querySelector('#p2').classList.add('show'),380);setTimeout(()=>document.querySelector('#p3').classList.add('show'),560)}
document.querySelector('#again').addEventListener('click',e=>{e.stopPropagation();start()});scene.addEventListener('click',e=>{if(e.target.closest('button'))return;if(started&&scene.classList.contains('done'))start()});setTimeout(start,700);
// Subtle ambient particles, kept sparse for a calm projection-friendly background.
const canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d');let w,h,dpr,particles=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);particles=Array.from({length:Math.round(w*h/6500)},()=>({x:Math.random()*w,y:Math.random()*h,r:.45+Math.random()*1.35,a:.16+Math.random()*.46,s:.12+Math.random()*.36,p:Math.random()*6.28}))}function draw(t){ctx.clearRect(0,0,w,h);for(const q of particles){q.y-=q.s*.34;q.x+=Math.sin(t*.00025+q.p)*.12;if(q.y<0)q.y=h;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,Math.PI*2);ctx.fillStyle=`rgba(119,190,255,${q.a*(.72+.28*Math.sin(t*.001+q.p))})`;ctx.fill()}requestAnimationFrame(draw)}addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script></body></html>
